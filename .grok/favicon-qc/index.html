<!doctype html>
<html><head><style>
  html,body{margin:0;background:#6a6a6a;display:flex;gap:28px;align-items:flex-end;padding:28px;font:12px sans-serif;color:#fff;}
  .box{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .tile{background:#fff;display:grid;place-items:center;}
  .s16{width:16px;height:16px;} .s16 svg{width:16px;height:16px;}
  .s32{width:32px;height:32px;} .s32 svg{width:32px;height:32px;}
  .s64{width:64px;height:64px;} .s64 svg{width:64px;height:64px;}
  .s128{width:128px;height:128px;} .s128 svg{width:128px;height:128px;}
  svg{display:block;}
</style></head>
<body>
  <div class="box"><div class="tile s16"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0A0A0A"/>
  <!-- spray-can body -->
  <rect x="12" y="12" width="8" height="14" rx="2" fill="#00B4FF"/>
  <!-- shoulder / collar -->
  <rect x="13" y="10" width="6" height="3" rx="1" fill="#F4F7FA"/>
  <!-- nozzle stem -->
  <rect x="15" y="7" width="2" height="3" fill="#F4F7FA"/>
  <!-- cap -->
  <rect x="14" y="5.5" width="4" height="2.2" rx="0.8" fill="#00B4FF"/>
  <!-- highlight stripe -->
  <rect x="13.4" y="14" width="1.4" height="9" rx="0.7" fill="#F4F7FA" opacity="0.55"/>
  <!-- cyan drip from nozzle -->
  <circle cx="20.5" cy="8.5" r="1.1" fill="#00B4FF"/>
  <path d="M20.1 9.4 C20.1 11.8 21.6 12.6 21.6 14.4" fill="none" stroke="#00B4FF" stroke-width="1.2" stroke-linecap="round"/>
</svg></div>16</div>
